<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/166d077dc6.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css/quiz_config.css?v=1.2">
    <title>Configurações - QUIZ</title>
</head>
<body>
    <main>
        <header id="cabecalho">
            <h1>DIDAKTOS</h1>
           <section id="secao">             
                <div id="menu">
                    <a id="perfil" href=""></a>
                    <div class="menucontent" >
                        <h4>User</h4>
                        <!-- <a id="config" href="#"></a> -->
                        <a href="suporte.html">
                            <i class="fa-solid fa-circle-question fa-2x" title="Suporte ao cliente para tirar dúvidas ou solucionar problemas."></i>
                        </a>
                        <a id="sair" href="index.html" title="Deslogar"></a>                       
                    </div>
                </div>
            </section>
        </header>
        <form action="../php/arnazenar_quizconfig.php" method="POST">
            <header>
                <h3 class="texto">Insira as informações do jogo</h3>
            </header>
            <section>
                <div>
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Defina um título para o seu jogo">
                    <label for="descricao">Descrição</label>
                    <textarea rows="2" cols="10" id="descricao" name="descricao" placeholder="Defina uma descrição para o seu jogo"></textarea>
                </div>
                <div>
                    <label for="dificuldade">Dificuldade</label>
                    <select id="dificuldade" name="dificuldade" title="Defina a dificuldade do seu jogo" required>
                        <option value="facil">Fácil</option>
                        <option value="medio">Médio</option>
                        <option value="dificil">Difícil</option>
                    </select>
                    <label for="publicar">Deseja publicar seu jogo?</label>
                    <select id="publicar" name="publicar" title="Publique ou apenas salve seu jogo. Se decidir publicar, ele ficará acessível para os outros usuários" required>
                        <option value="sim">Sim, desejo publicar</option>
                        <option value="nao">Não, somente quero salvar</option>
                    </select>
                </div>
            </section>
            <footer>
                <button type="submit">Enviar</button>
            </footer>
        </form>
    </main>
    <script>
        const url = new URLSearchParams(window.location.search);
        const insert = url.get('insert');
        const empty = url.get('empty');
        if(insert === 'true'){
            alert('Informações salvadas com sucesso!');
        }else if (insert === 'failed'){
            alert('Falha ao salvar as informações. Tente novamente.');
        };

        if(empty === 'true'){
            alert('Por favor preencha os campos obrigatórios.');
        };
    </script>
</body>
</html>
