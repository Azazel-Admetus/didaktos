<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/quiz.css">
    <title>Criar Quiz - DIDAKTOS</title>
</head>
<body>
    <main>
        <header>
            <a href="home.html">
                <h1>DIDAKTOS</h1>
            </a>
            <nav>
                <ul>
                    <li>
                        <a href="config.html">Configurações</a>
                    </li>
                    <li>
                        <a href="index.html">sair</a>
                    </li>
                </ul>
            </nav>
        </header>
        <section>
            <form action="../php/armazenar_quiz.php" method='post'>
                <header>
                    <h2>Crie um quiz educativo</h2>
                    <p>É obrigatório que se tenha no mínimo duas alternativas com uma delas sendo correta. Não é obrigatório definir as 5 alternativas. Pode deixá-las em branco, no jogo elas não aparecerão</p>
                </header>
                <label for="pergunta" >Pergunta</label>
                <input type="text" id="pergunta" name="pergunta" placeholder="Crie sua pergunta para o quiz" required>
                <label for="alternativa1">Alternativa A</label>
                <input type="text" id="alternativa1" name="alternativa1" placeholder="Defina uma possível resposta" required>
                <label for="alternativa2">Alternativa B</label>
                <input type="text" id="alternativa2" name="alternativa2" placeholder="Defina uma outra possível resposta" required>
                <label for="alternativa3" >Alternativa C</label>
                <input type="text" id="alternativa3" name="alternativa3"  placeholder="Defina uma outra possível resposta">
                <label for="alternativa4">Alternatica D</label>
                <input type="text" id="alternativa4" name="alternativa4"  placeholder="Defina uma outra possível resposta">
         
<!--                 
                <h3>Escolha a alternativa correta</h3>
                <p>O máximo de alternativas corretas que podem ser definidas é 3
                </p>
                <input type="radio" name="alternativas" value="A">A
                <input type="radio" name="alternativas" value="B">B
                <input type="radio" name="alternativas" value="C">C
                <input type="radio" name="alternativas" value="D">D -->
                <div id="checkbox-container"></div>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <script>
        const alternativas = [
            document.getElementById("alternativa1"),
            document.getElementById("alternativa2"),
            document.getElementById("alternativa3"),
            document.getElementById("alternativa4")
        ];
        const form = document.querySelector("form");

        const radiosContainer = document.getElementById("checkbox-container");

        let checkboxes = [];
        function atualizarCheckboxes (){
            radiosContainer.innerHTML = "<h3>Escolha a(s) alternativa(s) correta(s)</h3><p>Você poderá escolher de 1 até três respostas, dependendo da quantidade de alternativas preenchidas</p>";
            checkboxes = [];
            let preenchidas = 0;
            alternativas.forEach((alt, index) =>{
                if (alt.value.trim() !== ""){
                    preenchidas++;
                    const letra = String.fromCharCode(65 + index);
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.name = "alternativas_certas[]";
                    checkbox.value = letra;
                    checkbox.id = "checkbox" + letra;
                    
                    const label = document.createElement("label");
                    label.htmlFor = checkbox.id;
                    label.textContent = letra;
                    checkboxes.push(checkbox);
                    radiosContainer.appendChild(checkbox);
                    radiosContainer.appendChild(label);
                }
            });

            let limite = 1;
            if(preenchidas === 3) limite = 2;
            if(preechidas >= 4) limite = 3;
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener("change", () => {
                    const marcados = checkboxes.filter(c => c.checked);
                    if (!checkbox.checked && marcados.length >= limite){
                        e.preventDefault();
                        alert(`Você só pode escolher até ${limite } alternativa${limite > 1 ? 's' : ''} correta${limite > 1 ? 's' : ''}.`);
                    }
                });
              
            });

        }

        alternativas.forEach(input =>{
            input.addEventListener("input", atualizarCheckboxes)
        });
        atualizarCheckboxes();
    </script>
  
</body>
</html>
